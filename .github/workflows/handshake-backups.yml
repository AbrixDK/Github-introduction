name: Extract backup White House handshakes

on:
  pull_request:
    paths:
      - 'handshake/backup_candidates.py'
      - '.github/workflows/handshake-backups.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Install video tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core
      - name: Extract candidates
        run: python handshake/backup_candidates.py
      - uses: actions/upload-artifact@v4
        with:
          name: handshake-backups
          path: |
            handshake/backup_output/sheets
            handshake/backup_output/metadata.json
          if-no-files-found: error
          retention-days: 7
