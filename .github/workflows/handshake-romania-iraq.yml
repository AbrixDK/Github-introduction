name: Extract Romania and Iraq handshakes

on:
  pull_request:
    paths:
      - 'handshake/romania_iraq.py'
      - '.github/workflows/handshake-romania-iraq.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Install video tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core
      - name: Extract frames
        run: python handshake/romania_iraq.py
      - uses: actions/upload-artifact@v4
        with:
          name: handshake-romania-iraq
          path: |
            handshake/romania_iraq_output/sheets
            handshake/romania_iraq_output/metadata.json
          if-no-files-found: error
          retention-days: 7
