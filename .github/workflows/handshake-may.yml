name: Extract Theresa May handshake video

on:
  pull_request:
    paths:
      - 'handshake/may_sky.py'
      - '.github/workflows/handshake-may.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core
          python -m pip install --upgrade yt-dlp
      - name: Extract video frames
        run: python handshake/may_sky.py
      - name: Upload sheets
        uses: actions/upload-artifact@v4
        with:
          name: handshake-may-sky
          path: |
            handshake/may_output/sheets
            handshake/may_output/metadata.json
          if-no-files-found: error
          retention-days: 7
