name: Extract Swedish prime minister handshake

on:
  pull_request:
    paths:
      - 'handshake/lofven.py'
      - '.github/workflows/handshake-lofven.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install video tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core
      - name: Extract frames
        run: python handshake/lofven.py
      - uses: actions/upload-artifact@v4
        with:
          name: handshake-lofven
          path: |
            handshake/lofven_output/sheets
            handshake/lofven_output/metadata.json
          if-no-files-found: error
          retention-days: 7
