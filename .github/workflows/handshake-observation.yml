name: Handshake observation media

on:
  pull_request:
    paths:
      - 'handshake/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install video tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core

      - name: Download clips and extract contact sheets
        run: python handshake/extract.py

      - name: Upload observation package
        uses: actions/upload-artifact@v4
        with:
          name: handshake-observation-package
          path: handshake/output
          if-no-files-found: error
          retention-days: 7
