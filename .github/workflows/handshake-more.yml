name: Screen Turnbull and Macron handshake videos

on:
  pull_request:
    paths:
      - 'handshake/target_more.py'
      - '.github/workflows/handshake-more.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  screen:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Install video tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core
      - name: Screen videos
        run: python handshake/target_more.py
      - name: Upload sheets
        uses: actions/upload-artifact@v4
        with:
          name: handshake-turnbull-macron
          path: |
            handshake/more_output/sheets
            handshake/more_output/metadata.json
          if-no-files-found: error
          retention-days: 7
