name: Screen exact final handshake candidates

on:
  pull_request:
    paths:
      - 'handshake/exact_candidates.py'
      - '.github/workflows/handshake-exact.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  screen:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install video tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core

      - name: Screen exact files
        run: python handshake/exact_candidates.py

      - name: Upload sheets
        uses: actions/upload-artifact@v4
        with:
          name: handshake-exact-screening
          path: |
            handshake/exact_output/sheets
            handshake/exact_output/metadata.json
          if-no-files-found: error
          retention-days: 7
