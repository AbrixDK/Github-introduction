name: Search Commons for White House greeting videos

on:
  pull_request:
    paths:
      - 'handshake/search_commons.py'
      - '.github/workflows/handshake-search.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  search:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Search Wikimedia Commons
        run: python handshake/search_commons.py

      - name: Upload search results
        uses: actions/upload-artifact@v4
        with:
          name: handshake-commons-search
          path: handshake/search_output
          if-no-files-found: error
          retention-days: 7
